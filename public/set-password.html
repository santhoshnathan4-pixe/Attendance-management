<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Growbytee - Set Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
        }

        .password-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo h1 {
            color: #2563eb;
            font-size: 30px;
        }

        .logo p {
            color: #777;
            margin-top: 5px;
            font-size: 14px;
        }

        .page-title {
            text-align: center;
            margin: 25px 0;
            color: #333;
        }

        .info {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        .input-group input:focus {
            border-color: #2563eb;
        }

        .set-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .set-btn:hover {
            background: #1d4ed8;
        }

        .login-link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="password-container">

        <div class="logo">
            <h1>GROWBYTEE</h1>
            <p>Attendance Management System</p>
        </div>

        <h2 class="page-title">Set Your Password</h2>

        <div class="info">
            This is your first-time access.
            Create your own password to access the Employee Dashboard.
        </div>

        <div class="input-group">

            <label>Employee Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your employee email"
            >

        </div>

        <div class="input-group">

            <label>New Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter new password"
            >

        </div>

        <div class="input-group">

            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
            >

        </div>

        <button
            class="set-btn"
            onclick="setPassword()">
            Set Password
        </button>

        <p id="message"></p>

        <div class="login-link">
            Already have a password?
            <a href="employee-login.html">Login</a>
        </div>

    </div>


    <script>

        function setPassword() {

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message =
                document.getElementById("message");


            // =========================
            // EMPTY VALIDATION
            // =========================

            if (
                email === "" ||
                password === "" ||
                confirmPassword === ""
            ) {

                message.innerText =
                    "Please fill all fields.";

                message.style.color = "red";

                return;
            }


            // =========================
            // PASSWORD LENGTH
            // =========================

            if (password.length < 6) {

                message.innerText =
                    "Password must contain at least 6 characters.";

                message.style.color = "red";

                return;
            }


            // =========================
            // PASSWORD MATCH
            // =========================

            if (password !== confirmPassword) {

                message.innerText =
                    "Passwords do not match.";

                message.style.color = "red";

                return;
            }


            // =========================
            // SET PASSWORD API
            // =========================

            fetch(
                `/employee/set-password?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`,
                {
                    method: "POST"
                }
            )

            .then(response => {

                if (!response.ok) {
                    return response.text().then(error => {
                        throw new Error(error);
                    });
                }

                return response.text();
            })

            .then(data => {

                if (data === "Password Set Successfully") {

                    message.innerText =
                        "Password created successfully. Redirecting to login...";

                    message.style.color = "green";

                    setTimeout(() => {

                        window.location.href =
                            "employee-login.html";

                    }, 1500);

                } else {

                    message.innerText = data;

                    message.style.color = "red";
                }

            })

            .catch(error => {

                console.error(error);

                message.innerText =
                    error.message ||
                    "Unable to set password.";

                message.style.color = "red";

            });

        }

    </script>

</body>

</html>
