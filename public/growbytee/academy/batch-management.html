
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Batch Management | Growbytee Academy</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
.container{max-width:1200px;margin:35px auto;padding:0 20px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
h1{margin:0;font-size:25px}
.sub{color:#6b7280;margin-top:6px;font-size:14px}
button{border:0;border-radius:8px;padding:10px 15px;cursor:pointer}
.primary{background:#2563eb;color:white}
.search{width:100%;padding:12px;border:1px solid #dbe1ea;border-radius:8px;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}
.card{background:white;padding:18px;border-radius:12px;border:1px solid #e5e7eb}
.card span{color:#6b7280;font-size:13px}
.card strong{display:block;font-size:25px;margin-top:8px}
.table-box{background:white;border:1px solid #e5e7eb;border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:13px 15px;text-align:left;border-bottom:1px solid #edf0f4;font-size:14px;white-space:nowrap}
th{background:#f8fafc;color:#475569}
.actions button{padding:7px;margin-right:5px;background:#eef2ff}
.actions .delete{background:#fee2e2;color:#b91c1c}
.badge{padding:5px 9px;border-radius:20px;font-size:12px}
.active{background:#dcfce7;color:#166534}
.inactive{background:#fee2e2;color:#991b1b}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px}
.modal-box{background:white;width:100%;max-width:600px;border-radius:14px;padding:22px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-size:13px;color:#475569}
input,select{width:100%;margin-top:6px;padding:10px;border:1px solid #d7dce5;border-radius:7px}
.full{grid-column:1/-1}
.footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.close{background:#f1f5f9}
@media(max-width:700px){.cards{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>

<body>
<div class="container">

<div class="header">
<div>
<h1>Batch Management</h1>
<div class="sub">Manage Academy courses, trainers and class schedules</div>
</div>
<button class="primary" onclick="openModal()">
<i data-lucide="plus"></i> Add Batch
</button>
</div>

<input id="search" class="search" placeholder="Search batch..." oninput="render()">

<div class="cards">
<div class="card"><span>Total Batches</span><strong id="total">0</strong></div>
<div class="card"><span>Active</span><strong id="active">0</strong></div>
<div class="card"><span>Inactive</span><strong id="inactive">0</strong></div>
</div>

<div class="table-box">
<table>
<thead>
<tr>
<th>Batch</th>
<th>Course</th>
<th>Start</th>
<th>End</th>
<th>Trainer</th>
<th>Mode</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>
</div>
</div>

<div id="modal" class="modal">
<div class="modal-box">
<div class="modal-head">
<h2 id="modalTitle">Add Batch</h2>
<button class="close" onclick="closeModal()"><i data-lucide="x"></i></button>
</div>

<div class="form">
<div>
<label>Batch Name / Code</label>
<input id="batchName">
</div>

<div>
<label>Course</label>
<select id="course"></select>
</div>

<div>
<label>Start Date</label>
<input id="startDate" type="date">
</div>

<div>
<label>End Date</label>
<input id="endDate" type="date">
</div>

<div>
<label>Trainer</label>
<input id="trainer">
</div>

<div>
<label>Class Days</label>
<input id="days" placeholder="Mon, Wed, Fri">
</div>

<div>
<label>Class Time</label>
<input id="time" type="time">
</div>

<div>
<label>Mode</label>
<select id="mode">
<option value="">Select Mode</option>
<option>ONLINE</option>
<option>OFFLINE</option>
<option>HYBRID</option>
</select>
</div>
</div>

<div class="footer">
<button class="close" onclick="closeModal()">Cancel</button>
<button class="primary" onclick="save()">Save Batch</button>
</div>
</div>
</div>

<script>
const API="http://localhost:8080";
let batches=[],courses=[],editId=null;

const $=id=>document.getElementById(id);

async function load(){
try{
courses=await (await fetch(API+"/admin/student-courses/active")).json();
batches=await (await fetch(API+"/admin/student-batches")).json();
$("course").innerHTML='<option value="">Select Course</option>'+
courses.map(c=>`<option value="${c.id}">${c.courseName}</option>`).join("");
render();
}catch(e){alert("Unable to load batch data");}
}

function render(){
const q=$("search").value.toLowerCase();
const list=batches.filter(b=>
(b.batchName||"").toLowerCase().includes(q)||
courseName(b.courseId).toLowerCase().includes(q)||
(b.trainerName||"").toLowerCase().includes(q)
);

$("total").textContent=batches.length;
$("active").textContent=batches.filter(b=>b.active).length;
$("inactive").textContent=batches.filter(b=>!b.active).length;

$("body").innerHTML=list.map(b=>`
<tr>
<td>${b.batchName}</td>
<td>${courseName(b.courseId)}</td>
<td>${b.startDate||"-"}</td>
<td>${b.endDate||"-"}</td>
<td>${b.trainerName||"-"}</td>
<td>${b.mode||"-"}</td>
<td><span class="badge ${b.active?"active":"inactive"}">${b.active?"ACTIVE":"INACTIVE"}</span></td>
<td class="actions">
<button onclick="edit(${b.id})"><i data-lucide="pencil"></i></button>
<button class="delete" onclick="removeBatch(${b.id})"><i data-lucide="trash-2"></i></button>
</td>
</tr>`).join("");

lucide.createIcons();
}

function courseName(id){
return courses.find(c=>c.id==id)?.courseName||"Unknown";
}

function openModal(){
editId=null;
$("modalTitle").textContent="Add Batch";
["batchName","startDate","endDate","trainer","days","time"].forEach(x=>$(x).value="");
$("course").value="";
$("mode").value="";
$("modal").style.display="flex";
}

function closeModal(){$("modal").style.display="none"}

function edit(id){
const b=batches.find(x=>x.id==id);
if(!b)return;
editId=id;
$("modalTitle").textContent="Edit Batch";
$("batchName").value=b.batchName||"";
$("course").value=b.courseId;
$("startDate").value=b.startDate||"";
$("endDate").value=b.endDate||"";
$("trainer").value=b.trainerName||"";
$("days").value=b.classDays||"";
$("time").value=b.classTime||"";
$("mode").value=b.mode||"";
$("modal").style.display="flex";
}

async function save(){
const data={
batchName:$("batchName").value.trim(),
courseId:Number($("course").value),
startDate:$("startDate").value,
endDate:$("endDate").value||null,
trainerName:$("trainer").value.trim(),
classDays:$("days").value.trim(),
classTime:$("time").value,
mode:$("mode").value,
active:true
};

if(!data.batchName||!data.courseId||!data.startDate){
alert("Batch Name, Course and Start Date are required");
return;
}

try{
const res=await fetch(
API+"/admin/student-batches"+(editId?"/"+editId:""),
{
method:editId?"PUT":"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

if(!res.ok){
const msg=await res.json().catch(()=>null);
throw new Error(msg?.message||"Unable to save batch");
}

closeModal();
await load();
}catch(e){alert(e.message)}
}

async function removeBatch(id){
if(!confirm("Delete this batch?"))return;
try{
const res=await fetch(API+"/admin/student-batches/"+id,{method:"DELETE"});
if(!res.ok)throw new Error("Unable to delete batch");
await load();
}catch(e){alert(e.message)}
}

load();
</script>
</body>
</html>
