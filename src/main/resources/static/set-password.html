<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Growbytee - Set Password</title>

    
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background: #F5F8F6;
        color: #171717;
    }

    .password-container {
        width: 100%;
        max-width: 400px;
        background: #FFFFFF;
        padding: 35px;
        border: 1px solid #D9E7DD;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(11, 61, 34, 0.10);
    }

    .logo {
        text-align: center;
        margin-bottom: 10px;
    }

    .logo h1 {
        color: #16803C;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.5px;
    }

    .logo p {
        color: #666666;
        margin-top: 5px;
        font-size: 14px;
    }

    .page-title {
        text-align: center;
        margin: 25px 0;
        color: #0B3D22;
        font-size: 22px;
        font-weight: 750;
    }

    .info {
        background: #EAF6EE;
        border: 1px solid #C6E5D0;
        color: #0B3D22;
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 20px;
        line-height: 1.6;
    }

    .input-group {
        margin-bottom: 18px;
    }

    .input-group label {
        display: block;
        margin-bottom: 7px;
        color: #333333;
        font-size: 14px;
        font-weight: bold;
    }

    .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #D9E2DC;
        border-radius: 8px;
        outline: none;
        background: #FFFFFF;
        color: #171717;
        font-size: 15px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-group input:focus {
        border-color: #16803C;
        box-shadow: 0 0 0 3px rgba(22, 128, 60, 0.10);
    }

    .input-group input::placeholder {
        color: #999999;
    }

    .set-btn {
        width: 100%;
        padding: 13px;
        border: 1px solid #16803C;
        border-radius: 8px;
        background: #16803C;
        color: #FFFFFF;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .set-btn:hover {
        background: #0B3D22;
        border-color: #0B3D22;
        box-shadow: 0 4px 12px rgba(22, 128, 60, 0.18);
    }

    .set-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .login-link {
        text-align: center;
        margin-top: 18px;
        font-size: 14px;
        color: #666666;
    }

    .login-link a {
        color: #16803C;
        text-decoration: none;
        font-weight: bold;
        transition: color 0.2s ease;
    }

    .login-link a:hover {
        color: #0B3D22;
        text-decoration: underline;
    }

    #message {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
        font-weight: bold;
        line-height: 1.6;
        overflow-wrap: anywhere;
    }

    @media (max-width: 480px) {
        body {
            padding: 15px;
        }

        .password-container {
            padding: 25px 20px;
            border-radius: 12px;
        }

        .logo h1 {
            font-size: 26px;
        }

        .page-title {
            font-size: 20px;
            margin: 22px 0;
        }
    }
</style>

</head>

<body>

    <div class="password-container">

        <div class="logo">
            <h1>GROWBYTEE</h1>
            <p>Attendance Management System</p>
        </div>

        <h2 class="page-title">Set Your Password</h2>

        <div class="info">
            This is your first-time access.
            Create your own password to access the Employee Dashboard.
        </div>

        <div class="input-group">

            <label>Employee Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your employee email"
            >

        </div>

        <div class="input-group">

            <label>New Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter new password"
            >

        </div>

        <div class="input-group">

            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
            >

        </div>

        <button
            class="set-btn"
            onclick="setPassword()">
            Set Password
        </button>

        <p id="message"></p>

        <div class="login-link">
            Already have a password?
            <a href="employee-login.html">Login</a>
        </div>

    </div>


    <script>

        function setPassword() {

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message =
                document.getElementById("message");


            // =========================
            // EMPTY VALIDATION
            // =========================

            if (
                email === "" ||
                password === "" ||
                confirmPassword === ""
            ) {

                message.innerText =
                    "Please fill all fields.";

                message.style.color = "red";

                return;
            }


            // =========================
            // PASSWORD LENGTH
            // =========================

            if (password.length < 6) {

                message.innerText =
                    "Password must contain at least 6 characters.";

                message.style.color = "red";

                return;
            }


            // =========================
            // PASSWORD MATCH
            // =========================

            if (password !== confirmPassword) {

                message.innerText =
                    "Passwords do not match.";

                message.style.color = "red";

                return;
            }


            // =========================
            // SET PASSWORD API
            // =========================

            fetch(
                `/employee/set-password?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`,
                {
                    method: "POST"
                }
            )

            .then(response => {

                if (!response.ok) {
                    return response.text().then(error => {
                        throw new Error(error);
                    });
                }

                return response.text();
            })

            .then(data => {

                if (data === "Password Set Successfully") {

                    message.innerText =
                        "Password created successfully. Redirecting to login...";

                    message.style.color = "green";

                    setTimeout(() => {

                        window.location.href =
                            "employee-login.html";

                    }, 1500);

                } else {

                    message.innerText = data;

                    message.style.color = "red";
                }

            })

            .catch(error => {

                console.error(error);

                message.innerText =
                    error.message ||
                    "Unable to set password.";

                message.style.color = "red";

            });

        }

    </script>

</body>

</html>
