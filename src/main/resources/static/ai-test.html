<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance AI</title>

    <script src="https://unpkg.com/lucide@latest"></script>

    
<style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #F4F7F5;
            color: #171717;
        }

        .container {
            width: min(900px, 92%);
            margin: 50px auto;
        }

        .card {
            background: #FFFFFF;
            border: 1px solid #D9E7DD;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(11, 46, 26, 0.06);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .header-icon {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: #E8F5EC;
            color: #16803C;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            color: #171717;
        }

        .subtitle {
            margin: 5px 0 0;
            color: #64748B;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            min-height: 110px;
            resize: vertical;
            padding: 14px;
            border: 1px solid #C8D8CD;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: #FFFFFF;
            color: #171717;
            font-family: Arial, sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            border-color: #16803C;
            box-shadow: 0 0 0 3px rgba(22, 128, 60, 0.12);
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 12px;
        }

        button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 0;
            border-radius: 9px;
            padding: 11px 18px;
            background: #16803C;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) {
            background: #0F642E;
        }

        button:focus-visible {
            outline: 3px solid #86C99A;
            outline-offset: 3px;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .response {
            margin-top: 24px;
            padding: 18px;
            background: #F8FAF8;
            border: 1px solid #D9E7DD;
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.6;
            min-height: 80px;
            overflow-wrap: anywhere;
        }

        .label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #171717;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
            }

            .card {
                padding: 18px;
            }
        }
</style>

</head>

<body>

    <main class="container">

        <section class="card">

            <div class="header">

                <div class="header-icon">
                    <i data-lucide="sparkles"></i>
                </div>

                <div>
                    <h1>Attendance AI</h1>
                    <p class="subtitle">
                        Ask questions about employee attendance
                    </p>
                </div>

            </div>

            <label class="label" for="question">
                Ask your question
            </label>

            <textarea
                id="question"
                placeholder="Example: இந்த மாதம் யார் அதிகமாக late வந்திருக்கிறார்கள்?"></textarea>

            <div class="actions">

                <button
                    id="askButton"
                    type="button"
                    onclick="askAttendanceAI()">

                    <i data-lucide="send"></i>

                    Ask AI

                </button>

            </div>

            <div
                id="response"
                class="response">
                AI response will appear here.
            </div>

        </section>

    </main>

    <script>

        const API_BASE =
            "http://localhost:8080";

        async function askAttendanceAI() {

            const question =
                document.getElementById(
                    "question"
                ).value.trim();

            const responseBox =
                document.getElementById(
                    "response"
                );

            const button =
                document.getElementById(
                    "askButton"
                );

            if (!question) {

                responseBox.textContent =
                    "Please enter a question.";

                return;
            }

            button.disabled = true;

            responseBox.textContent =
                "AI is analyzing attendance data...";

            try {

                const response =
                    await fetch(
                        `${API_BASE}/api/ai/attendance`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                question: question
                            })
                        }
                    );

                const data =
                    await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "AI request failed."
                    );
                }

                responseBox.textContent =
                    data.response ||
                    "No response received.";

            } catch (error) {

                responseBox.textContent =
                    "Error: " +
                    error.message;

            } finally {

                button.disabled = false;

                lucide.createIcons();
            }
        }

        lucide.createIcons();

    </script>

</body>

</html>
