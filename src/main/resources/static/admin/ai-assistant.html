<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GROWBYTEE - AI Assistant</title>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #f4f7fb;
        color: #1f2937;
    }

    .container {
        display: flex;
        min-height: 100vh;
    }

    .sidebar {
        width: 250px;
        background: #334155;
        color: white;
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        padding: 25px 15px;
        overflow-y: auto;
    }

    .logo {
        text-align: center;
        font-size: 25px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .admin-title {
        text-align: center;
        color: #cbd5e1;
        font-size: 13px;
        margin-bottom: 30px;
    }

    .menu {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .menu button {
        border: none;
        background: transparent;
        color: #e5e7eb;
        text-align: left;
        padding: 14px 15px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 15px;
        transition: 0.2s;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .menu button svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
    }

    .menu button:hover,
.menu button.active {
        background: rgba(255, 255, 255, 0.15);
        color: white;
    }

    .logout-btn {
        margin-top: 25px;
        background: #dc2626 !important;
        color: white !important;
        text-align: center !important;
    }

    .logout-btn:hover {
        background: #b91c1c !important;
    }

    .main {
        margin-left: 250px;
        width: calc(100% - 250px);
        min-height: 100vh;
    }

    .header {
        height: 75px;
        background: white;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        position: sticky;
        top: 0;
        z-index: 20;
    }

    .header h1 {
        font-size: 23px;
        color: #111827;
    }

    .admin-info {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #475569;
        font-size: 14px;
    }

    .admin-badge {
        background: #2563eb;
        color: white;
        padding: 8px 13px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
    }

    .content {
        padding: 30px;
    }

    .section {
        display: none;
        padding: 24px;
        border-radius: 16px;
        min-height: calc(100vh - 135px);
        border: 1px solid #e5e7eb;
    }

    .section.active {
        display: block;
    }

    #dashboard {
        background: #f8fafc;
    }

    #leave {
        background: #fbfaf8;
    }

    #salary {
        background: #f8fbfa;
    }

    #history {
        background: #f8fafb;
    }

    .section-title {
        font-size: 25px;
        margin-bottom: 8px;
        color: #111827;
    }

    .section-subtitle {
        color: #64748b;
        margin-bottom: 25px;
        font-size: 14px;
    }

    .btn {
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: 0.2s;
    }

    .btn-primary {
        background: #2563eb;
        color: white;
    }

    .btn-primary:hover {
        background: #1d4ed8;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 900px;
    }

    th {
        background: #eff6ff;
        color: #1e3a8a;
        font-size: 13px;
        text-align: left;
        padding: 14px;
        white-space: nowrap;
    }

    td {
        padding: 13px 14px;
        border-top: 1px solid #e5e7eb;
        font-size: 13px;
        white-space: nowrap;
    }

    tr:hover td {
        background: #f8fafc;
    }

    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.65);
        z-index: 100;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .modal.show {
        display: flex;
    }

    .message {
        display: none;
        margin-bottom: 18px;
        padding: 12px 15px;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 600;
    }

    .message.show {
        display: block;
    }

    .message.error {
        background: #fee2e2;
        color: #991b1b;
    }

    @media (max-width: 800px) {
        .sidebar {
            width: 210px;
        }

        .main {
            margin-left: 210px;
            width: calc(100% - 210px);
        }

        .header {
            padding: 0 15px;
        }

        .content {
            padding: 20px 15px;
        }

        .section {
            padding: 18px;
        }
    }

    @media (max-width: 600px) {
        .sidebar {
            position: relative;
            width: 100%;
            min-height: auto;
        }

        .container {
            display: block;
        }

        .main {
            margin-left: 0;
            width: 100%;
        }

        .header {
            position: relative;
        }

        .admin-info {
            display: none;
        }
    }

    </style>

</head>

<body>

<div class="container">

    <aside class="sidebar">

        <div class="logo">
            GROWBYTEE
        </div>

        <div class="admin-title">
            Admin / CEO Dashboard
        </div>

        <div class="menu">


    <button class="menu-btn"
        onclick="window.location.href='/admin-dashboard.html'">
    <i data-lucide="layout-dashboard"></i>
    Dashboard
</button>

    <button class="menu-btn"
            onclick="window.location.href='employees.html'">
        <i data-lucide="users"></i>
        Employees
    </button>

    <button class="menu-btn"
            onclick="window.location.href='leave.html'">
        <i data-lucide="clipboard-list"></i>
        Leave
    </button>

    
<button class="menu-btn active"
        onclick="window.location.href='ai-assistant.html'">
    <i data-lucide="sparkles"></i>
    AI Assistant
</button>



    <button class="menu-btn"
            onclick="window.location.href='working-day-settings.html'">
        <i data-lucide="calendar-days"></i>
        Working Day Settings
    </button>

    <button class="menu-btn"
            onclick="window.location.href='shift-settings.html'">
        <i data-lucide="clock-3"></i>
        Shift Settings
    </button>

    <button class="menu-btn"
        onclick="window.location.href='branch-management.html'">
    <i data-lucide="building-2"></i>
    Branch Management
</button>

    <button class="menu-btn"
            onclick="window.location.href='leave-permission-settings.html'">
        <i data-lucide="settings"></i>
        Leave & Permission Settings
    </button>

    <button class="menu-btn"
            onclick="window.location.href='salary.html'">
        <i data-lucide="wallet"></i>
        Salary
    </button>

    <button class="menu-btn"
            onclick="window.location.href='monthly-report.html'">
        <i data-lucide="calendar-days"></i>
        Monthly Report
    </button>

    <button class="menu-btn"
            onclick="window.location.href='history.html'">
        <i data-lucide="history"></i>
        History
    </button>

    <button class="menu-btn logout-btn"
            onclick="logout()">
        <i data-lucide="log-out"></i>
        Logout
    </button>


        </div>

    </aside>

    <main class="main">

        <header class="header">

            <h1>
                GROWBYTEE - Admin Dashboard
            </h1>

            <div class="admin-info" id="adminInfo" style="display: none;">

                <span id="loggedAdminName">
                    Welcome, Admin
                </span>

                <span class="admin-badge">
                    ADMIN
                </span>

            </div>

        </header>

        <div class="content">

<section id="aiAssistant" class="section active">


<h2 class="section-title">
    AI Assistant
</h2>

<p class="section-subtitle">
    Ask questions about employee attendance using text or voice
</p>

<div style="
    background:#ffffff;
    border:1px solid #e2e8f0;
    border-radius:14px;
    padding:20px;
    margin-top:18px;
    box-shadow:0 4px 18px rgba(15,23,42,.05);
">

    <label style="
        display:block;
        font-weight:600;
        margin-bottom:8px;
    ">
        Ask your question
    </label>

    <textarea
        id="adminAiQuestion"
        placeholder="Example: intha month yaaru romba late ah vanthurukanga?"
        style="
            width:100%;
            min-height:100px;
            resize:vertical;
            padding:12px;
            border:1px solid #cbd5e1;
            border-radius:9px;
            outline:none;
            font-size:14px;
        "
    ></textarea>

    <div style="
        display:flex;
        justify-content:flex-end;
        gap:8px;
        margin-top:12px;
        flex-wrap:wrap;
    ">

        <button
            id="adminAiVoiceButton"
            type="button"
            class="btn"
            onclick="toggleAdminAiVoice()"
            style="
                display:flex;
                align-items:center;
                gap:7px;
            ">

            <i
                id="adminAiVoiceIcon"
                data-lucide="mic">
            </i>

            <span id="adminAiVoiceText">
                Voice
            </span>

        </button>

        <button
            id="adminAiSpeakButton"
            type="button"
            class="btn"
            onclick="speakAdminAiResponse()"
            style="
                display:flex;
                align-items:center;
                gap:7px;
            ">

            <i data-lucide="volume-2"></i>

            Speak Answer

        </button>

        <button
            id="adminAiButton"
            type="button"
            class="btn btn-primary"
            onclick="askAdminAttendanceAI()"
            style="
                display:flex;
                align-items:center;
                gap:7px;
            ">

            <i data-lucide="sparkles"></i>

            Ask AI

        </button>

    </div>

    <div
        id="adminAiVoiceStatus"
        style="
            margin-top:10px;
            font-size:13px;
            color:#64748b;
            min-height:20px;
        "
    ></div>

    <div
        id="adminAiResponse"
        style="
            margin-top:18px;
            padding:15px;
            min-height:70px;
            background:#f8fafc;
            border:1px solid #e2e8f0;
            border-radius:9px;
            white-space:pre-wrap;
            line-height:1.6;
            color:#334155;
        "
    >
        AI response will appear here.
    </div>

</div>


</section>

        </div>

    </main>

</div>

<script>

    function loadAdminInfo() {

        const adminEmail =
            localStorage.getItem(
                "adminEmail"
            );

        const adminName =
            localStorage.getItem(
                "adminName"
            );


        if (adminName) {

            const adminNameElement =
                document.getElementById(
                    "loggedAdminName"
                );

            if (adminNameElement) {

                adminNameElement.textContent =
                    "Welcome, " + adminName;

            }

        }


        if (adminEmail) {

            const emailField =
                document.getElementById(
                    "verifyAdminEmail"
                );

            if (emailField) {

                emailField.value =
                    adminEmail;

            }

        }

    }

    function logout() {

        const confirmed =
            confirm(
                "Are you sure you want to logout?"
            );


        if (!confirmed) {
            return;
        }


        localStorage.removeItem(
            "adminEmail"
        );


        localStorage.removeItem(
            "adminName"
        );


        window.location.href =
            "admin-login.html";

    }

    document.querySelectorAll(
        ".modal"
    ).forEach(
        function(modal) {

            modal.addEventListener(
                "click",
                function(event) {

                    if (
                        event.target ===
                        modal
                    ) {

                        modal.classList.remove(
                            "show"
                        );

                    }

                }
            );

        }
    );

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            if (typeof lucide !== "undefined") {
                lucide.createIcons();
            }

            loadAdminInfo();



        }
    );


    let adminAiRecognition = null;

    let adminAiListening = false;


    function setupAdminAiVoice() {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        const voiceButton =
            document.getElementById(
                "adminAiVoiceButton"
            );

        if (!SpeechRecognition) {

            if (voiceButton) {
                voiceButton.disabled = true;
                voiceButton.title =
                    "Voice input is not supported in this browser.";
            }

            return;
        }


        adminAiRecognition =
            new SpeechRecognition();


        adminAiRecognition.continuous = false;

        adminAiRecognition.interimResults = false;

        adminAiRecognition.lang = "en-IN";


        adminAiRecognition.onstart =
            function() {

                adminAiListening = true;

                const status =
                    document.getElementById(
                        "adminAiVoiceStatus"
                    );

                const text =
                    document.getElementById(
                        "adminAiVoiceText"
                    );

                const icon =
                    document.getElementById(
                        "adminAiVoiceIcon"
                    );


                if (status) {
                    status.textContent =
                        "Listening... Please speak your question.";
                }

                if (text) {
                    text.textContent =
                        "Stop";
                }

                if (icon) {
                    icon.setAttribute(
                        "data-lucide",
                        "mic-off"
                    );
                }

                refreshAdminAiIcons();
            };


        adminAiRecognition.onresult =
            function(event) {

                const transcript =
                    event.results[0][0]
                        .transcript
                        .trim();


                const question =
                    document.getElementById(
                        "adminAiQuestion"
                    );


                if (question) {
                    question.value =
                        transcript;
                }


                const status =
                    document.getElementById(
                        "adminAiVoiceStatus"
                    );


                if (status) {
                    status.textContent =
                        "Voice input captured. You can ask AI now.";
                }
            };


        adminAiRecognition.onerror =
            function(event) {

                adminAiListening = false;

                const status =
                    document.getElementById(
                        "adminAiVoiceStatus"
                    );

                if (status) {

                    if (event.error === "not-allowed") {

                        status.textContent =
                            "Microphone permission was denied.";

                    } else {

                        status.textContent =
                            "Voice input error: " +
                            event.error;
                    }
                }

                resetAdminAiVoiceButton();
            };


        adminAiRecognition.onend =
            function() {

                adminAiListening = false;

                resetAdminAiVoiceButton();
            };
    }


    function toggleAdminAiVoice() {

        if (!adminAiRecognition) {

            setupAdminAiVoice();

            if (!adminAiRecognition) {
                return;
            }
        }


        if (adminAiListening) {

            adminAiRecognition.stop();

            return;
        }


        const status =
            document.getElementById(
                "adminAiVoiceStatus"
            );


        if (status) {
            status.textContent =
                "Starting microphone...";
        }


        try {

            adminAiRecognition.start();

        } catch (error) {

            if (status) {
                status.textContent =
                    "Microphone could not be started.";
            }
        }
    }


    function resetAdminAiVoiceButton() {

        const text =
            document.getElementById(
                "adminAiVoiceText"
            );

        const icon =
            document.getElementById(
                "adminAiVoiceIcon"
            );


        if (text) {
            text.textContent =
                "Voice";
        }


        if (icon) {

            icon.setAttribute(
                "data-lucide",
                "mic"
            );
        }


        refreshAdminAiIcons();
    }


    function refreshAdminAiIcons() {

        if (
            typeof lucide !==
            "undefined"
        ) {

            lucide.createIcons();
        }
    }


    function speakAdminAiResponse() {

        const responseBox =
            document.getElementById(
                "adminAiResponse"
            );


        if (!responseBox) {
            return;
        }


        const text =
            responseBox.textContent.trim();


        if (
            !text ||
            text ===
            "AI response will appear here."
        ) {

            return;
        }


        if (
            !("speechSynthesis" in window)
        ) {

            responseBox.textContent +=
                "\n\nVoice output is not supported in this browser.";

            return;
        }


        window.speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(
                text
            );


        if (
            /[\u0B80-\u0BFF]/.test(text)
        ) {

            utterance.lang =
                "ta-IN";

        } else {

            utterance.lang =
                "en-IN";
        }


        utterance.rate = 0.95;

        utterance.pitch = 1;


        window.speechSynthesis.speak(
            utterance
        );
    }

    async function askAdminAttendanceAI() {

        const question =
            document.getElementById(
                "adminAiQuestion"
            ).value.trim();

        const responseBox =
            document.getElementById(
                "adminAiResponse"
            );

        const button =
            document.getElementById(
                "adminAiButton"
            );

        if (!question) {

            responseBox.textContent =
                "Please enter a question.";

            return;
        }

        button.disabled = true;

        responseBox.textContent =
            "AI is analyzing attendance data...";

        try {

            const response =
                await fetch(
                    "https://attendance-management-d5h6.onrender.com/api/ai/attendance",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            question: question
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "AI request failed."
                );
            }

            responseBox.textContent =
                data.response ||
                "No response received.";

        } catch (error) {

            responseBox.textContent =
                "Error: " +
                error.message;

        } finally {

            button.disabled = false;

            refreshAdminAiIcons();
        }


    }

    setupAdminAiVoice();

    refreshAdminAiIcons();


</script>

</body>

</html>
