<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GROWBYTEE - Monthly Report</title>

    <script src="https://unpkg.com/lucide@latest"></script>

   <style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #F5F8F5;
        color: #171717;
    }

    .container {
        display: flex;
        min-height: 100vh;
    }

    .sidebar {
        width: 250px;
        background: linear-gradient(180deg, #0B2E1A, #171717);
        color: #FFFFFF;
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        padding: 25px 15px;
        overflow-y: auto;
    }

    .logo {
        text-align: center;
        font-size: 25px;
        font-weight: bold;
        margin-bottom: 8px;
        color: #FFFFFF;
    }

    .admin-title {
        text-align: center;
        color: #C7D8CC;
        font-size: 13px;
        margin-bottom: 30px;
    }

    .menu {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .menu button {
        border: none;
        background: transparent;
        color: #E5E7EB;
        text-align: left;
        padding: 14px 15px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 15px;
        transition: 0.2s;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .menu button svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
    }

    .menu button:hover,
    .menu button.active {
        background: #16803C;
        color: #FFFFFF;
    }

    .logout-btn {
        margin-top: 25px;
        background: #DC2626 !important;
        color: #FFFFFF !important;
        text-align: center !important;
    }

    .logout-btn:hover {
        background: #B91C1C !important;
    }

    .main {
        margin-left: 250px;
        width: calc(100% - 250px);
        min-height: 100vh;
    }

    .header {
        height: 75px;
        background: #FFFFFF;
        border-bottom: 1px solid #D9E7DD;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        position: sticky;
        top: 0;
        z-index: 20;
    }

    .header h1 {
        font-size: 23px;
        color: #171717;
    }

    .admin-info {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #475569;
        font-size: 14px;
    }

    .admin-badge {
        background: #16803C;
        color: #FFFFFF;
        padding: 8px 13px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
    }

    .content {
        padding: 30px;
    }

    .section {
        display: none;
        padding: 24px;
        border-radius: 16px;
        min-height: calc(100vh - 135px);
        border: 1px solid #D9E7DD;
    }

    .section.active {
        display: block;
    }

    #dashboard {
        background: #F5F8F5;
    }

    #leave {
        background: #FBFAF5;
    }

    #salary {
        background: #F3F8F4;
    }

    #monthly {
        background: #F6F8F5;
    }

    #history {
        background: #F5F8F6;
    }

    .section-title {
        font-size: 25px;
        margin-bottom: 8px;
        color: #171717;
    }

    .section-subtitle {
        color: #647568;
        margin-bottom: 25px;
        font-size: 14px;
    }

    .top-bar {
        background: #FFFFFF;
        padding: 18px;
        border-radius: 13px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        box-shadow: 0 4px 15px rgba(11, 46, 26, 0.06);
        border: 1px solid #E2EBE4;
    }

    .btn {
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: 0.2s;
    }

    .btn-primary {
        background: #16803C;
        color: #FFFFFF;
    }

    .btn-primary:hover {
        background: #0F642E;
    }

    .table-card {
        background: #FFFFFF;
        border-radius: 14px;
        box-shadow: 0 5px 20px rgba(11, 46, 26, 0.06);
        overflow: hidden;
        border: 1px solid #D9E7DD;
    }

    .table-wrapper {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 900px;
    }

    th {
        background: #0B2E1A;
        color: #FFFFFF;
        font-size: 13px;
        text-align: left;
        padding: 14px;
        white-space: nowrap;
    }

    td {
        padding: 13px 14px;
        border-top: 1px solid #E2EBE4;
        font-size: 13px;
        white-space: nowrap;
    }

    tr:hover td {
        background: #F0F7F1;
    }

    .empty-row {
        text-align: center;
        color: #647568;
        padding: 30px;
    }

    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(11, 25, 16, 0.65);
        z-index: 100;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .modal.show {
        display: flex;
    }

    .message {
        display: none;
        margin-bottom: 18px;
        padding: 12px 15px;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 600;
    }

    .message.show {
        display: block;
    }

    .message.success {
        background: #DCFCE7;
        color: #166534;
    }

    .message.error {
        background: #FEE2E2;
        color: #991B1B;
    }

    .filter-box {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .filter-box input,
    .filter-box select {
        padding: 10px 12px;
        border: 1px solid #C8D8CC;
        border-radius: 8px;
        outline: none;
        background: #FFFFFF;
        color: #171717;
    }

    .filter-box input:focus,
    .filter-box select:focus {
        border-color: #16803C;
        box-shadow: 0 0 0 3px rgba(22, 128, 60, 0.12);
    }

    @media (max-width: 800px) {
        .sidebar {
            width: 210px;
        }

        .main {
            margin-left: 210px;
            width: calc(100% - 210px);
        }

        .header {
            padding: 0 15px;
        }

        .content {
            padding: 20px 15px;
        }

        .section {
            padding: 18px;
        }
    }

    @media (max-width: 600px) {
        .sidebar {
            position: relative;
            width: 100%;
            min-height: auto;
        }

        .container {
            display: block;
        }

        .main {
            margin-left: 0;
            width: 100%;
        }

        .header {
            position: relative;
        }

        .top-bar {
            flex-direction: column;
            align-items: stretch;
        }

        .admin-info {
            display: none;
        }
    }


/* ===== GROWBYTEE UI v2 (black / green / white) ===== */
:root{--g:#16803C;--gd:#0B2E1A;--gl:#E8F5EC;--k:#171717;--line:#E1E8E3;--mut:#6B7A70;--bg:#F4F6F5;--red:#DC2626}
*{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif!important}
body{background:var(--bg)!important;color:var(--k);font-size:14px}
.sidebar{display:none!important}
.header{height:60px!important;background:#fff!important;border-bottom:1px solid var(--line)!important;padding:0 28px!important;box-shadow:none!important}
.header h1{font-size:17px!important;font-weight:700!important}
.admin-info{color:var(--mut)!important;font-size:13px!important}
.admin-badge{background:var(--gd)!important;color:#fff!important;padding:4px 10px!important;border-radius:99px!important;font-size:11px!important;letter-spacing:.4px;border:0!important}
.content{padding:22px 28px!important;max-width:1400px}
.section{background:transparent!important;border:0!important;padding:0!important;min-height:0!important}
.section-title h2,h2.section-title{display:none!important}
.page-heading h2{display:none!important}
.section-title{margin-bottom:14px!important}
.section-subtitle{color:var(--mut)!important;font-size:13px!important;margin:0 0 14px!important;max-width:none!important}
.section-title .section-subtitle,.page-heading .section-subtitle{margin:0!important}
.btn{border:1px solid transparent;border-radius:8px!important;padding:9px 16px!important;font-size:13px!important;font-weight:600!important}
.btn-primary,.btn-weekly,.btn-success.solid{background:var(--g)!important;color:#fff!important;border-color:var(--g)!important}
.btn-primary:hover,.btn-weekly:hover{background:var(--gd)!important;border-color:var(--gd)!important}
.btn-secondary{background:#fff!important;color:var(--k)!important;border:1px solid var(--line)!important}
.btn-secondary:hover{background:var(--gl)!important;border-color:#BFE0CB!important}
.btn-danger{background:#fff!important;color:var(--red)!important;border:1px solid #F3C5C5!important}
.btn-danger:hover{background:#FEF2F2!important}
.btn-small{padding:6px 12px!important;font-size:12px!important}
.top-bar{background:#fff!important;border:1px solid var(--line)!important;border-radius:12px!important;box-shadow:none!important;padding:12px 14px!important;margin-bottom:14px!important}
.table-card,.calendar-card,.weekly-off-summary{background:#fff!important;border:1px solid var(--line)!important;border-radius:12px!important;box-shadow:none!important}
th{background:#F7F9F8!important;color:var(--mut)!important;font-size:11px!important;letter-spacing:.5px;text-transform:uppercase;padding:12px 14px!important;border-bottom:1px solid var(--line)}
td{padding:12px 14px!important;border-top:1px solid #EEF1EF!important;border-bottom:0!important;font-size:13px!important}
tbody tr:first-child td{border-top:0!important}
tr:hover td,tbody tr:hover td{background:#F7FAF8!important}
.empty-row{color:var(--mut)!important}
.form-group label,.filter-item label{font-size:12px!important;font-weight:700!important;color:#33433A!important}
.form-group input,.form-group select,.form-group textarea,.filter-item select,.filter-box input,.filter-box select,.adjust-select{border:1px solid #CBD8CF!important;border-radius:8px!important;padding:10px 12px!important;font-size:14px!important;background:#fff}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus,.filter-item select:focus,.filter-box select:focus{border-color:var(--g)!important;box-shadow:0 0 0 3px rgba(22,128,60,.12)!important;outline:0}
.modal{background:rgba(15,26,20,.55)!important;z-index:100}
.modal-box{border-radius:14px!important;box-shadow:0 20px 50px rgba(0,0,0,.25)!important}
.modal-header{border-bottom:1px solid var(--line)!important;padding-bottom:14px!important;margin-bottom:18px!important}
.modal-header h2,.modal-header h3{font-size:17px!important}
.close-btn{border-radius:8px!important;background:#EEF1EF!important;color:var(--k)!important;width:32px!important;height:32px!important}
.close-btn:hover{background:#DDE5DF!important}
.modal-footer{border-top:1px solid var(--line)!important;padding-top:14px!important;margin-top:20px!important}
.message{border-radius:8px!important;font-size:13px!important}
.info-box,.setting-help,.weekly-off-modal-help{background:var(--gl)!important;border:1px solid #BFE0CB!important;color:#14532D!important;border-radius:10px!important}
@media(max-width:800px){.header{padding:0 16px 0 60px!important}.content{padding:16px!important}}
@media(max-width:600px){.admin-info{display:none!important}}

.top-bar{justify-content:flex-start!important;gap:12px!important}
.top-bar .filter-box{gap:10px}
.top-bar .btn{white-space:nowrap}
.mr-spacer{flex:1}
tbody td:first-child{font-weight:600;color:var(--mut)}
</style>

</head>

<body>

<div class="container">

    <main class="main">

        <header class="header"><h1>Monthly Report</h1><div class="admin-info" id="adminInfo" style="display:flex"><span id="loggedAdminName">Welcome, Admin</span><span class="admin-badge">ADMIN</span></div></header>

        <div class="content">

<section id="monthly" class="section active"> 
 
    <h2 class="section-title"> 
        Monthly Report 
    </h2> 
 
    <p class="section-subtitle"> 
        Attendance, leave and permission summary for every employee. 
    </p> 
 
    <div id="monthlyMessage" 
         class="message"> 
    </div> 
 
    <div class="top-bar">
        <div class="filter-box">
            <select id="reportYear" onchange="loadMonthlyReport()"></select>
            <select id="reportMonth" onchange="loadMonthlyReport()">
                <option value="1">January</option><option value="2">February</option><option value="3">March</option>
                <option value="4">April</option><option value="5">May</option><option value="6">June</option>
                <option value="7">July</option><option value="8">August</option><option value="9">September</option>
                <option value="10">October</option><option value="11">November</option><option value="12">December</option>
            </select>
        </div>
        <span class="mr-spacer"></span>
        <button class="btn btn-secondary" onclick="loadMonthlyReport()">Refresh</button>
        <button class="btn btn-primary" onclick="downloadMonthlyExcel()">Download Excel</button>
    </div>

    <div class="table-card"> 
 
        <div class="table-wrapper"> 
 
            <table> 
 
                <thead> 
 
                <tr> 
                    <th>Employee Code</th> 
                    <th>Name</th> 
                    <th>Present</th> 
                    <th>Absent</th>
                    <th>LOP Leave</th>
                    <th>Sick Leave</th>
                    <th>Casual Leave</th>
                    <th>Permission</th>
                    <th>Working Days</th> 
                </tr> 
 
                </thead> 
 
                <tbody id="monthlyTableBody"> 
 
                <tr> 
                    <td colspan="9" 
                        class="empty-row"> 
                        Loading report... 
                    </td> 
                </tr> 
 
                </tbody> 
 
            </table> 
 
        </div> 
 
    </div> 
 
</section> 

        </div>

    </main>

</div>

<script>

    const API_BASE_URL =
        window.location.hostname === "localhost" ||
            window.location.hostname === "127.0.0.1"
            ? "http://localhost:8080"
            : "https://attendance-management-d5h6.onrender.com";

    async function apiFetch(
        url,
        options = {}
    ) {

        return fetch(
            API_BASE_URL + url,
            options
        );

    }

    function loadAdminInfo() {

        const adminEmail =
            localStorage.getItem(
                "adminEmail"
            );

        const adminName =
            localStorage.getItem(
                "adminName"
            );


        if (adminName) {

            const adminNameElement =
                document.getElementById(
                    "loggedAdminName"
                );

            if (adminNameElement) {

                adminNameElement.textContent =
                    "Welcome, " + adminName;

            }

        }


        if (adminEmail) {

            const emailField =
                document.getElementById(
                    "verifyAdminEmail"
                );

            if (emailField) {

                emailField.value =
                    adminEmail;

            }

        }

    }

    async function getErrorMessage(
        response
    ) {

        try {

            const text =
                await response.text();


            if (!text) {

                return (
                    "Request failed. HTTP " +
                    response.status
                );

            }


            try {

                const json =
                    JSON.parse(
                        text
                    );


                return (
                    json.message ||
                    json.error ||
                    text
                );

            }
            catch {

                return text;

            }

        }
        catch {

            return (
                "Request failed. HTTP " +
                response.status
            );

        }

    }

    function showMessage(
        elementId,
        message,
        type
    ) {

        const element =
            document.getElementById(
                elementId
            );


        if (!element) {
            return;
        }


        element.textContent =
            message;


        element.className =
            "message show " +
            (
                type === "success"
                    ? "success"
                    : "error"
            );


        setTimeout(
            function() {

                element.classList.remove(
                    "show"
                );

            },
            5000
        );

    }

    function formatNumber(
        value
    ) {

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {

            return "0.00";

        }


        const number =
            Number(value);


        if (
            Number.isNaN(number)
        ) {

            return "0.00";

        }


        return number.toLocaleString(
            "en-IN",
            {
                minimumFractionDigits:
                    2,

                maximumFractionDigits:
                    2

            }
        );

    }

    function escapeHtml(
        value
    ) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );

    }

    function logout() {

        const confirmed =
            confirm(
                "Are you sure you want to logout?"
            );


        if (!confirmed) {
            return;
        }


        localStorage.removeItem(
            "adminEmail"
        );


        localStorage.removeItem(
            "adminName"
        );


        window.location.href =
            "admin-login.html";

    }

    function setupYears() {

        const currentYear = new Date().getFullYear();

        const select = document.getElementById("reportYear");

        if (select) {

            select.innerHTML = "";

            for (let year = currentYear - 2; year <= currentYear + 1; year++) {

                const option = document.createElement("option");

                option.value = year;
                option.textContent = year;

                if (year === currentYear) {
                    option.selected = true;
                }

                select.appendChild(option);

            }

        }

        const monthSelect = document.getElementById("reportMonth");

        if (monthSelect) {
            monthSelect.value = new Date().getMonth() + 1;
        }

    }

    async function loadMonthlyReport() {

        const year =
            document.getElementById(
                "reportYear"
            ).value;


        const month =
            document.getElementById(
                "reportMonth"
            ).value;


        if (!year || !month) {
            return;
        }


        try {

            const response =
                await apiFetch(
                    `/admin/monthly-report?year=${year}&month=${month}`
                );


            if (!response.ok) {

                throw new Error(
                    await getErrorMessage(
                        response
                    )
                );

            }


            const data =
                await response.json();


            renderMonthlyReport(
                data
            );

        }
        catch (error) {

            console.error(
                error
            );


            showMessage(
                "monthlyMessage",
                error.message,
                "error"
            );

        }

    }

    function generateMonthlyReport() {

        loadMonthlyReport();


        const year =
            document.getElementById(
                "reportYear"
            ).value;


        const month =
            document.getElementById(
                "reportMonth"
            ).value;


        if (!year || !month) {
            return;
        }


        const url =
            `${API_BASE_URL}/admin/monthly-report/excel?year=${year}&month=${month}`;


        window.open(
            url,
            "_blank"
        );

    }

    function downloadMonthlyExcel() {
        const year = document.getElementById("reportYear").value;
        const month = document.getElementById("reportMonth").value;
        if (!year || !month) return;
        window.open(`${API_BASE_URL}/admin/monthly-report/excel?year=${year}&month=${month}`, "_blank");
    }

    function renderMonthlyReport(data) {

        const tbody =
            document.getElementById("monthlyTableBody");

        if (!data || data.length === 0) {

            tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="empty-row">
                            No monthly report data found.
                        </td>
                    </tr>
                `;

            return;
        }

        tbody.innerHTML = data.map(function(item) {

            const covered =
                Number(item.balanceCovered || 0);

            const absentNote =
                covered > 0
                    ? ' <span style="font-size:12px;color:#16803C;">(' +
                    formatNumber(covered) +
                    ' paid from leave balance)</span>'
                    : "";

            return `
                    <tr>
                        <td>${escapeHtml(item.employeeCode ?? "-")}</td>
                        <td><strong>${escapeHtml(item.employeeName ?? "-")}</strong></td>
                        <td>${escapeHtml(item.presentDays ?? 0)}</td>
                        <td>${formatNumber(item.absent ?? 0)}${absentNote}</td>
                        <td>${formatNumber(item.lopLeave ?? 0)}</td>
                        <td>${formatNumber(item.sickLeave ?? 0)}</td>
                        <td>${formatNumber(item.casualLeave ?? 0)}</td>
                        <td>${escapeHtml(item.permission ?? 0)}</td>
                        <td>${escapeHtml(item.workingDays ?? 0)}</td>
                    </tr>
                `;

        }).join("");
    }

    document.querySelectorAll(
        ".modal"
    ).forEach(
        function(modal) {

            modal.addEventListener(
                "click",
                function(event) {

                    if (
                        event.target ===
                        modal
                    ) {

                        modal.classList.remove(
                            "show"
                        );

                    }

                }
            );

        }
    );

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            if (typeof lucide !== "undefined") {
                lucide.createIcons();
            }

            loadAdminInfo();

            setupYears();
            loadMonthlyReport();

        }
    );

</script>

<script src="/admin/admin-sidebar.js" defer></script>
</body>

</html>
