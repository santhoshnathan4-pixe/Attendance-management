<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GROWBYTEE - Monthly Report</title>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #f4f7fb;
        color: #1f2937;
    }

    .container {
        display: flex;
        min-height: 100vh;
    }

    .sidebar {
        width: 250px;
        background: #334155;
        color: white;
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        padding: 25px 15px;
        overflow-y: auto;
    }

    .logo {
        text-align: center;
        font-size: 25px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .admin-title {
        text-align: center;
        color: #cbd5e1;
        font-size: 13px;
        margin-bottom: 30px;
    }

    .menu {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .menu button {
        border: none;
        background: transparent;
        color: #e5e7eb;
        text-align: left;
        padding: 14px 15px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 15px;
        transition: 0.2s;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .menu button svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
    }

    .menu button:hover,
.menu button.active {
        background: rgba(255, 255, 255, 0.15);
        color: white;
    }

    .logout-btn {
        margin-top: 25px;
        background: #dc2626 !important;
        color: white !important;
        text-align: center !important;
    }

    .logout-btn:hover {
        background: #b91c1c !important;
    }

    .main {
        margin-left: 250px;
        width: calc(100% - 250px);
        min-height: 100vh;
    }

    .header {
        height: 75px;
        background: white;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        position: sticky;
        top: 0;
        z-index: 20;
    }

    .header h1 {
        font-size: 23px;
        color: #111827;
    }

    .admin-info {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #475569;
        font-size: 14px;
    }

    .admin-badge {
        background: #2563eb;
        color: white;
        padding: 8px 13px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
    }

    .content {
        padding: 30px;
    }

    .section {
        display: none;
        padding: 24px;
        border-radius: 16px;
        min-height: calc(100vh - 135px);
        border: 1px solid #e5e7eb;
    }

    .section.active {
        display: block;
    }

    #dashboard {
        background: #f8fafc;
    }

    #leave {
        background: #fbfaf8;
    }

    #salary {
        background: #f8fbfa;
    }

    #monthly {
        background: #faf9fc;
    }

    #history {
        background: #f8fafb;
    }

    .section-title {
        font-size: 25px;
        margin-bottom: 8px;
        color: #111827;
    }

    .section-subtitle {
        color: #64748b;
        margin-bottom: 25px;
        font-size: 14px;
    }

    .top-bar {
        background: white;
        padding: 18px;
        border-radius: 13px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        box-shadow: 0 4px 15px rgba(15, 23, 42, 0.05);
    }

    .btn {
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: 0.2s;
    }

    .btn-primary {
        background: #2563eb;
        color: white;
    }

    .btn-primary:hover {
        background: #1d4ed8;
    }

    .table-card {
        background: white;
        border-radius: 14px;
        box-shadow: 0 5px 20px rgba(15, 23, 42, 0.06);
        overflow: hidden;
        border: 1px solid #e5e7eb;
    }

    .table-wrapper {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 900px;
    }

    th {
        background: #eff6ff;
        color: #1e3a8a;
        font-size: 13px;
        text-align: left;
        padding: 14px;
        white-space: nowrap;
    }

    td {
        padding: 13px 14px;
        border-top: 1px solid #e5e7eb;
        font-size: 13px;
        white-space: nowrap;
    }

    tr:hover td {
        background: #f8fafc;
    }

    .empty-row {
        text-align: center;
        color: #64748b;
        padding: 30px;
    }

    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.65);
        z-index: 100;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .modal.show {
        display: flex;
    }

    .message {
        display: none;
        margin-bottom: 18px;
        padding: 12px 15px;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 600;
    }

    .message.show {
        display: block;
    }

    .message.success {
        background: #dcfce7;
        color: #166534;
    }

    .message.error {
        background: #fee2e2;
        color: #991b1b;
    }

    .filter-box {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .filter-box input,
.filter-box select {
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        outline: none;
    }

    @media (max-width: 800px) {
        .sidebar {
            width: 210px;
        }

        .main {
            margin-left: 210px;
            width: calc(100% - 210px);
        }

        .header {
            padding: 0 15px;
        }

        .content {
            padding: 20px 15px;
        }

        .section {
            padding: 18px;
        }
    }

    @media (max-width: 600px) {
        .sidebar {
            position: relative;
            width: 100%;
            min-height: auto;
        }

        .container {
            display: block;
        }

        .main {
            margin-left: 0;
            width: 100%;
        }

        .header {
            position: relative;
        }

        .top-bar {
            flex-direction: column;
            align-items: stretch;
        }

        .admin-info {
            display: none;
        }
    }

    </style>

</head>

<body>

<div class="container">

    <aside class="sidebar">

        <div class="logo">
            GROWBYTEE
        </div>

        <div class="admin-title">
            Admin / CEO Dashboard
        </div>

        <div class="menu">


    <button class="menu-btn"
        onclick="window.location.href='/admin-dashboard.html'">
    <i data-lucide="layout-dashboard"></i>
    Dashboard
</button>

    <button class="menu-btn"
            onclick="window.location.href='employees.html'">
        <i data-lucide="users"></i>
        Employees
    </button>

    <button class="menu-btn"
            onclick="window.location.href='leave.html'">
        <i data-lucide="clipboard-list"></i>
        Leave
    </button>

    
<button class="menu-btn"
        onclick="window.location.href='ai-assistant.html'">
    <i data-lucide="sparkles"></i>
    AI Assistant
</button>



    <button class="menu-btn"
            onclick="window.location.href='working-day-settings.html'">
        <i data-lucide="calendar-days"></i>
        Working Day Settings
    </button>

    <button class="menu-btn"
            onclick="window.location.href='shift-settings.html'">
        <i data-lucide="clock-3"></i>
        Shift Settings
    </button>

    <button class="menu-btn"
        onclick="window.location.href='branch-management.html'">
    <i data-lucide="building-2"></i>
    Branch Management
</button>

    <button class="menu-btn"
            onclick="window.location.href='leave-permission-settings.html'">
        <i data-lucide="settings"></i>
        Leave & Permission Settings
    </button>

    <button class="menu-btn"
            onclick="window.location.href='salary.html'">
        <i data-lucide="wallet"></i>
        Salary
    </button>

    <button class="menu-btn active"
            onclick="window.location.href='monthly-report.html'">
        <i data-lucide="calendar-days"></i>
        Monthly Report
    </button>

    <button class="menu-btn"
            onclick="window.location.href='history.html'">
        <i data-lucide="history"></i>
        History
    </button>

    <button class="menu-btn logout-btn"
            onclick="logout()">
        <i data-lucide="log-out"></i>
        Logout
    </button>


        </div>

    </aside>

    <main class="main">

        <header class="header">

            <h1>
                GROWBYTEE - Admin Dashboard
            </h1>

            <div class="admin-info" id="adminInfo" style="display: none;">

                <span id="loggedAdminName">
                    Welcome, Admin
                </span>

                <span class="admin-badge">
                    ADMIN
                </span>

            </div>

        </header>

        <div class="content">

<section id="monthly" class="section active"> 
 
    <h2 class="section-title"> 
        Monthly Report 
    </h2> 
 
    <p class="section-subtitle"> 
        Employee attendance monthly report 
    </p> 
 
    <div id="monthlyMessage" 
         class="message"> 
    </div> 
 
    <div class="top-bar"> 
 
        <div class="filter-box"> 
 
            <select id="reportYear"></select> 
 
            <select id="reportMonth"> 
 
                <option value="1">January</option> 
                <option value="2">February</option> 
                <option value="3">March</option> 
                <option value="4">April</option> 
                <option value="5">May</option> 
                <option value="6">June</option> 
                <option value="7">July</option> 
                <option value="8">August</option> 
                <option value="9">September</option> 
                <option value="10">October</option> 
                <option value="11">November</option> 
                <option value="12">December</option> 
 
            </select> 
 
        </div> 
 
        <button class="btn btn-primary" 
                onclick="generateMonthlyReport()"> 
            Generate Report 
        </button> 
 
    </div> 
 
    <div class="table-card"> 
 
        <div class="table-wrapper"> 
 
            <table> 
 
                <thead> 
 
                <tr> 
                    <th>Employee Code</th> 
                    <th>Name</th> 
                    <th>Present</th> 
                    <th>Absent</th>
                    <th>LOP Leave</th>
                    <th>Sick Leave</th>
                    <th>Casual Leave</th>
                    <th>Permission</th>
                    <th>Working Days</th> 
                </tr> 
 
                </thead> 
 
                <tbody id="monthlyTableBody"> 
 
                <tr> 
                    <td colspan="9" 
                        class="empty-row"> 
                        Generate monthly report 
                    </td> 
                </tr> 
 
                </tbody> 
 
            </table> 
 
        </div> 
 
    </div> 
 
</section> 

        </div>

    </main>

</div>

<script>

    const API_BASE_URL =
        window.location.hostname === "localhost" ||
            window.location.hostname === "127.0.0.1"
            ? "http://localhost:8080"
            : "https://attendance-management-d5h6.onrender.com";

    async function apiFetch(
        url,
        options = {}
    ) {

        return fetch(
            API_BASE_URL + url,
            options
        );

    }

    function loadAdminInfo() {

        const adminEmail =
            localStorage.getItem(
                "adminEmail"
            );

        const adminName =
            localStorage.getItem(
                "adminName"
            );


        if (adminName) {

            const adminNameElement =
                document.getElementById(
                    "loggedAdminName"
                );

            if (adminNameElement) {

                adminNameElement.textContent =
                    "Welcome, " + adminName;

            }

        }


        if (adminEmail) {

            const emailField =
                document.getElementById(
                    "verifyAdminEmail"
                );

            if (emailField) {

                emailField.value =
                    adminEmail;

            }

        }

    }

    async function getErrorMessage(
        response
    ) {

        try {

            const text =
                await response.text();


            if (!text) {

                return (
                    "Request failed. HTTP " +
                    response.status
                );

            }


            try {

                const json =
                    JSON.parse(
                        text
                    );


                return (
                    json.message ||
                    json.error ||
                    text
                );

            }
            catch {

                return text;

            }

        }
        catch {

            return (
                "Request failed. HTTP " +
                response.status
            );

        }

    }

    function showMessage(
        elementId,
        message,
        type
    ) {

        const element =
            document.getElementById(
                elementId
            );


        if (!element) {
            return;
        }


        element.textContent =
            message;


        element.className =
            "message show " +
            (
                type === "success"
                    ? "success"
                    : "error"
            );


        setTimeout(
            function() {

                element.classList.remove(
                    "show"
                );

            },
            5000
        );

    }

    function formatNumber(
        value
    ) {

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {

            return "0.00";

        }


        const number =
            Number(value);


        if (
            Number.isNaN(number)
        ) {

            return "0.00";

        }


        return number.toLocaleString(
            "en-IN",
            {
                minimumFractionDigits:
                    2,

                maximumFractionDigits:
                    2

            }
        );

    }

    function escapeHtml(
        value
    ) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );

    }

    function logout() {

        const confirmed =
            confirm(
                "Are you sure you want to logout?"
            );


        if (!confirmed) {
            return;
        }


        localStorage.removeItem(
            "adminEmail"
        );


        localStorage.removeItem(
            "adminName"
        );


        window.location.href =
            "admin-login.html";

    }

    function setupYears() {

        const currentYear = new Date().getFullYear();

        const select = document.getElementById("reportYear");

        if (select) {

            select.innerHTML = "";

            for (let year = currentYear - 2; year <= currentYear + 1; year++) {

                const option = document.createElement("option");

                option.value = year;
                option.textContent = year;

                if (year === currentYear) {
                    option.selected = true;
                }

                select.appendChild(option);

            }

        }

        const monthSelect = document.getElementById("reportMonth");

        if (monthSelect) {
            monthSelect.value = new Date().getMonth() + 1;
        }

    }

    async function loadMonthlyReport() {

        const year =
            document.getElementById(
                "reportYear"
            ).value;


        const month =
            document.getElementById(
                "reportMonth"
            ).value;


        if (!year || !month) {
            return;
        }


        try {

            const response =
                await apiFetch(
                    `/admin/monthly-report?year=${year}&month=${month}`
                );


            if (!response.ok) {

                throw new Error(
                    await getErrorMessage(
                        response
                    )
                );

            }


            const data =
                await response.json();


            renderMonthlyReport(
                data
            );

        }
        catch (error) {

            console.error(
                error
            );


            showMessage(
                "monthlyMessage",
                error.message,
                "error"
            );

        }

    }

    function generateMonthlyReport() {

        loadMonthlyReport();


        const year =
            document.getElementById(
                "reportYear"
            ).value;


        const month =
            document.getElementById(
                "reportMonth"
            ).value;


        if (!year || !month) {
            return;
        }


        const url =
            `${API_BASE_URL}/admin/monthly-report/excel?year=${year}&month=${month}`;


        window.open(
            url,
            "_blank"
        );

    }

    function renderMonthlyReport(data) {

        const tbody =
            document.getElementById("monthlyTableBody");

        if (!data || data.length === 0) {

            tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="empty-row">
                            No monthly report data found.
                        </td>
                    </tr>
                `;

            return;
        }

        tbody.innerHTML = data.map(function(item) {

            const covered =
                Number(item.balanceCovered || 0);

            const absentNote =
                covered > 0
                    ? ' <span style="font-size:12px;color:#16a34a;">(' +
                    formatNumber(covered) +
                    ' paid from leave balance)</span>'
                    : "";

            return `
                    <tr>
                        <td>${escapeHtml(item.employeeCode ?? "-")}</td>
                        <td><strong>${escapeHtml(item.employeeName ?? "-")}</strong></td>
                        <td>${escapeHtml(item.presentDays ?? 0)}</td>
                        <td>${formatNumber(item.absent ?? 0)}${absentNote}</td>
                        <td>${formatNumber(item.lopLeave ?? 0)}</td>
                        <td>${formatNumber(item.sickLeave ?? 0)}</td>
                        <td>${formatNumber(item.casualLeave ?? 0)}</td>
                        <td>${escapeHtml(item.permission ?? 0)}</td>
                        <td>${escapeHtml(item.workingDays ?? 0)}</td>
                    </tr>
                `;

        }).join("");
    }

    document.querySelectorAll(
        ".modal"
    ).forEach(
        function(modal) {

            modal.addEventListener(
                "click",
                function(event) {

                    if (
                        event.target ===
                        modal
                    ) {

                        modal.classList.remove(
                            "show"
                        );

                    }

                }
            );

        }
    );

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            if (typeof lucide !== "undefined") {
                lucide.createIcons();
            }

            loadAdminInfo();

            setupYears();
            loadMonthlyReport();

        }
    );

</script>

</body>

</html>
