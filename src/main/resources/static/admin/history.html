/*
 * SINGLE VERTICAL TABLE VIEWING AREA
 *
 * This is the only vertical scrolling area.
 */
.history-scroll-area {
    width: 100%;
    height: 65vh;
    min-height: 420px;
    max-height: 760px;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;

.history-scroll-area::-webkit-scrollbar {

    background: #f1f5f9;
}

.history-scroll-area::-webkit-scrollbar-thumb {

    border-radius: 10px;
}

.history-scroll-area::-webkit-scrollbar-thumb:hover {
    background: #64748b;
}

/*
 * STICKY HEADER AREA
 *
 * Heading and horizontal scrollbar stay together
 * while vertical scrolling happens.
 */
.history-sticky-header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: white;
    width: 100%;
}

/*
 * HEADER HORIZONTAL VIEW
 *
 * Heading can move left/right together with data.
 */

    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    background: #eff6ff;
}

.history-header-scroll::-webkit-scrollbar {

}

.history-horizontal-scroll::-webkit-scrollbar-thumb:hover {

}

</div>

<script>

    const API_BASE_URL =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
            ? "http://localhost:8080"
            : "https://attendance-management-d5h6.onrender.com";


    async function apiFetch(
        url,
        options = {}
    ) {

        return fetch(
            API_BASE_URL + url,
            options
        );

    }


    function loadAdminInfo() {

        const adminName =
            localStorage.getItem(
                "adminName"
            );

        const adminNameElement =
            document.getElementById(
                "loggedAdminName"
            );

        if (
            adminName &&
            adminNameElement
        ) {

            adminNameElement.textContent =
                "Welcome, " + adminName;

        }

    }


    async function getErrorMessage(
        response
    ) {

        try {

            const text =
                await response.text();

            if (!text) {

                return (
                    "Request failed. HTTP " +
                    response.status
                );

            }

            try {

                const json =
                    JSON.parse(text);

                return (
                    json.message ||
                    json.error ||
                    text
                );

            }
            catch {

                return text;

            }

        }
        catch {

            return (
                "Request failed. HTTP " +
                response.status
            );

        }

    }


    function showMessage(
        elementId,
        message,
        type
    ) {

        const element =
            document.getElementById(
                elementId
            );

        if (!element) {
            return;
        }

        element.textContent =
            message;

        element.className =
            "message show " +
            (
                type === "success"
                    ? "success"
                    : "error"
            );

        setTimeout(
            function() {

                element.classList.remove(
                    "show"
                );

            },
            5000
        );

    }


    function escapeHtml(
        value
    ) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    function logout() {

        const confirmed =
            confirm(
                "Are you sure you want to logout?"
            );

        if (!confirmed) {
            return;
        }

        localStorage.removeItem(
            "adminEmail"
        );

        localStorage.removeItem(
            "adminName"
        );

        window.location.href =
            "admin-login.html";

    }


    function setupYears() {

        const select =
            document.getElementById(
                "historyYear"
            );

        if (!select) {
            return;
        }

        const currentYear =
            new Date().getFullYear();

        select.innerHTML = "";

        const allYearsOption =
            document.createElement(
                "option"
            );

        allYearsOption.value = "";

        allYearsOption.textContent =
            "All Years";

        select.appendChild(
            allYearsOption
        );

        for (
            let year = currentYear - 2;
            year <= currentYear + 1;
            year++
        ) {

            const option =
                document.createElement(
                    "option"
                );

            option.value = year;

            option.textContent = year;

            select.appendChild(option);

        }

    }


    /*
     * Synchronize:
     *
     * 1. Visible horizontal scrollbar
     * 2. Header horizontal position
     * 3. Data horizontal position
     */
    function setupHorizontalScroll() {

        const horizontalScroll =
            document.getElementById(
                "historyHorizontalScroll"
            );

        const horizontalContent =
            document.getElementById(
                "historyHorizontalScrollContent"
            );

        const headerScroll =
            document.getElementById(
                "historyHeaderScroll"
            );

        const bodyScroll =
            document.getElementById(
                "historyBodyScroll"
            );

        const headerTable =
            document.getElementById(
                "historyHeaderTable"
            );

        const bodyTable =
            document.getElementById(
                "historyBodyTable"
            );


        if (
            !horizontalScroll ||
            !horizontalContent ||
            !headerScroll ||
            !bodyScroll ||
            !headerTable ||
            !bodyTable
        ) {

            return;

        }


        function updateHorizontalWidth() {

            const headerWidth =
                headerTable.scrollWidth;

            const bodyWidth =
                bodyTable.scrollWidth;

            const width =
                Math.max(
                    headerWidth,
                    bodyWidth,
                    headerScroll.clientWidth
                );

            horizontalContent.style.width =
                width + "px";

        }


        let syncing = false;


        horizontalScroll.addEventListener(
            "scroll",
            function() {

                if (syncing) {
                    return;
                }

                syncing = true;

                headerScroll.scrollLeft =
                    horizontalScroll.scrollLeft;

                bodyScroll.scrollLeft =
                    horizontalScroll.scrollLeft;

                syncing = false;

            }
        );


        headerScroll.addEventListener(
            "scroll",
            function() {

                if (syncing) {
                    return;
                }

                syncing = true;

                horizontalScroll.scrollLeft =
                    headerScroll.scrollLeft;

                bodyScroll.scrollLeft =
                    headerScroll.scrollLeft;

                syncing = false;

            }
        );


        bodyScroll.addEventListener(
            "scroll",
            function() {

                if (syncing) {
                    return;
                }

                syncing = true;

                horizontalScroll.scrollLeft =
                    bodyScroll.scrollLeft;

                headerScroll.scrollLeft =
                    bodyScroll.scrollLeft;

                syncing = false;

            }
        );


        window.addEventListener(
            "resize",
            updateHorizontalWidth
        );


        updateHorizontalWidth();

    }


    async function loadHistory() {

        const year =
            document.getElementById(
                "historyYear"
            ).value;

        const month =
            document.getElementById(
                "historyMonth"
            ).value;


        if (
            month &&
            !year
        ) {

            showMessage(
                "historyMessage",
                "Please select a year before selecting a month.",
                "error"
            );

            return;

        }


        let url =
            "/admin/audit";


        const params =
            new URLSearchParams();


        if (year) {

            params.append(
                "year",
                year
            );

        }


        if (month) {

            params.append(
                "month",
                month
            );

        }


        if (
            params.toString()
        ) {

            url +=
                "?" +
                params.toString();

        }


        const tbody =
            document.getElementById(
                "historyTableBody"
            );


        tbody.innerHTML = `
            <tr>
                <td colspan="10"
                    class="empty-row">
                    Loading history...
                </td>
            </tr>
        `;


        try {

            const response =
                await apiFetch(url);


            if (!response.ok) {

                throw new Error(
                    await getErrorMessage(
                        response
                    )
                );

            }


            const data =
                await response.json();


            renderHistory(data);


            setTimeout(
                function() {

                    setupHorizontalScroll();

                },
                50
            );

        }
        catch (error) {

            console.error(
                "HISTORY LOAD ERROR:",
                error
            );


            tbody.innerHTML = `
                <tr>
                    <td colspan="10"
                        class="empty-row">
                        Unable to load history.
                    </td>
                </tr>
            `;


            showMessage(
                "historyMessage",
                error.message ||
                "Unable to load history.",
                "error"
            );

        }

    }


    function renderHistory(data) {

        const tbody =
            document.getElementById(
                "historyTableBody"
            );


        if (
            !Array.isArray(data) ||
            data.length === 0
        ) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="10"
                        class="empty-row">
                        No history records found.
                    </td>
                </tr>
            `;

            return;

        }


        tbody.innerHTML =
            data.map(
                function(item) {

                    const actionDate =
                        item.actionDate ?? "-";

                    const actionTime =
                        item.actionTime ?? "-";

                    const adminName =
                        item.adminName ?? "-";

                    const action =
                        item.action ?? "-";

                    const employeeCode =
                        item.employeeCode ?? "-";

                    const employeeName =
                        item.employeeName ?? "-";

                    const fieldName =
                        item.fieldName ?? "-";

                    const oldValue =
                        item.oldValue ?? "-";

                    const newValue =
                        item.newValue ?? "-";

                    const reason =
                        item.reason ?? "-";


                    return `
                        <tr>

                            <td>
                                ${escapeHtml(actionDate)}
                            </td>

                            <td>
                                ${escapeHtml(actionTime)}
                            </td>

                            <td>
                                <strong>
                                    ${escapeHtml(adminName)}
                                </strong>
                            </td>

                            <td class="history-action">
                                ${escapeHtml(action)}
                            </td>

                            <td>
                                ${escapeHtml(employeeCode)}
                            </td>

                            <td>
                                ${escapeHtml(employeeName)}
                            </td>

                            <td>
                                ${escapeHtml(fieldName)}
                            </td>

                            <td class="value-cell">
                                ${escapeHtml(oldValue)}
                            </td>

                            <td class="value-cell">
                                ${escapeHtml(newValue)}
                            </td>

                            <td class="reason-cell">
                                ${escapeHtml(reason)}
                            </td>

                        </tr>
                    `;

                }
            ).join("");

    }


    document.addEventListener(
        "DOMContentLoaded",
        function() {

            if (
                typeof lucide !==
                "undefined"
            ) {

                lucide.createIcons();

            }


            loadAdminInfo();

            setupYears();

            setupHorizontalScroll();

            loadHistory();

        }
    );

</script>


</body>

</html>
